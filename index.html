<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ethan Sotka</title>
    <style>

      body{
        background-color: #F4F7FA;
        color: #333333;
      }

      main{
      }

      footer{
        background-color: #E0E6ED;
        position: fixed;
        bottom: 0;
        padding: 20px;
        width: 100%;
      }

      .profile-pic {
       border-radius: 50%;
       width: 300px;
       height: 300px;
       object-fit: cover;
       border: 3px solid #333;
       margin-top: 100px;
     }

     .center {
       text-align: center;
       margin-top: 10px;
     }

     .icon {
       color: #D3D3D3;
       margin: 20px;
       text-decoration: none;
       transition: transform 0.3s ease, color 0.3s ease;
     }

     .icon:hover {
        color: #555555;
        transform: scale(1.3);
     }

     h1{
       display: block;
       margin-top: 15px;
       font-family: sans-serif;
       color: #1A2E49;
       transition: transform 0.2s ease;

     }

     h1:hover{
        transform: scale(1.6);
     }


     h2,h3,h4,h5,h6{
       color: #1A2E49;
     }

    </style>
    <link 
       rel="stylesheet" 
       href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div class="center">
         <img src="SeniorPhotoFixed.jpeg" alt="Photo of Me!" class="profile-pic" >
         <h1>Ethan Sotka</h1>
         <div>
            <a href="https://github.com/esotka1" class="icon">
              <i class="fab fa-github fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/ethan-sotka" class="icon">
              <i class="fab fa-linkedin fa-2x"></i>
            </a>
            <a href="Ethan_Sotka_Resume.pdf" class="icon">
              <i class="fas fa-file-alt fa-2x"></i>
            </a>
         </div>
      </div>
    </main>
    <footer>
      <div class="center">
            <a href="#" onclick="copy('esotka@nd.edu')" class="icon">
               <i class="fas fa-envelope  fa-2x"></i>
            </a>
            <a href="#" onclick="copy('410-402-0535')" class="icon">
               <i class="fas fa-phone  fa-2x"></i>
            </a>
      </div>
    </footer>
    <script>
      function copy(address) {
        const tempInput = document.createElement('input');
        tempInput.value = address;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert("Copied to clipboard: " + address);
      }
    </script>
  </body>
</html>
